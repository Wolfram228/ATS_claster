            {"data":{"leading":false,"html":"&lt;h2 id=\"1-obshaya-arhitektura\"&gt;&lt;a href=\"ru/sub-section/frontend.html#1-obshaya-arhitektura\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Общая архитектура&lt;/span&gt;&lt;/a&gt;1. Общая архитектура&lt;/h2&gt;\n&lt;p&gt;Фронтенд проекта реализован на &lt;strong&gt;Vue 3&lt;/strong&gt;, использует &lt;strong&gt;Vite&lt;/strong&gt; как инструмент сборки и &lt;strong&gt;Vuetify 3&lt;/strong&gt; в роли UI-фреймворка.&lt;br /&gt;\nСтруктура организована модульно и разделена на функциональные блоки:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;src/\n  assets/        — статические ресурсы (графики, изображения, JSON-данные)\n  components/    — переиспользуемые элементы интерфейса\n  views/         — страницы, соответствующие маршрутам\n  router/        — конфигурация маршрутизации\n  vuetify/       — инициализация UI-фреймворка\n  App.vue        — корневой компонент приложения\n  main.js        — точка входа\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Собранная версия фронтенда размещается в каталоге &lt;strong&gt;dist/&lt;/strong&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"2-marshrutizaciya\"&gt;&lt;a href=\"ru/sub-section/frontend.html#2-marshrutizaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Маршрутизация&lt;/span&gt;&lt;/a&gt;2. Маршрутизация&lt;/h2&gt;\n&lt;p&gt;В проекте используется &lt;strong&gt;vue-router&lt;/strong&gt; в режиме &lt;em&gt;createWebHistory&lt;/em&gt;.&lt;br /&gt;\nОпределены базовые маршруты:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Путь&lt;/th&gt;\n&lt;th&gt;Компонент&lt;/th&gt;\n&lt;th&gt;Назначение&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y76rgp9i\"&gt;/&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Home.vue&lt;/td&gt;\n&lt;td&gt;Главная страница&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q6ay9omt\"&gt;/home&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;redirect → &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ot3huyyz\"&gt;/&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Редирект&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j1dny60x\"&gt;/reports&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Reports.vue&lt;/td&gt;\n&lt;td&gt;Просмотр отчётов (основа для будущего расширения)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7gtpy99v\"&gt;/table&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Table.vue&lt;/td&gt;\n&lt;td&gt;Отображение данных в табличном формате&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fqks5l4v\"&gt;/reportInfo/:reportId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;ReportInfo.vue&lt;/td&gt;\n&lt;td&gt;Просмотр подробной информации по отчёту&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1img3v9e\"&gt;/:pathMatch(.*)*&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;NotFound.vue&lt;/td&gt;\n&lt;td&gt;Обработка 404&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Компоненты загружаются динамически, что снижает размер первоначальной сборки.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"3-inicializaciya-prilozheniya\"&gt;&lt;a href=\"ru/sub-section/frontend.html#3-inicializaciya-prilozheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Инициализация приложения&lt;/span&gt;&lt;/a&gt;3. Инициализация приложения&lt;/h2&gt;\n&lt;p&gt;Создание приложения происходит в файле &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-afuu8jdh\"&gt;main.js&lt;/code&gt;.&lt;br /&gt;\nПодключаются:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;глобальный роутер,&lt;/li&gt;\n&lt;li&gt;экземпляр Vuetify,&lt;/li&gt;\n&lt;li&gt;общие стили.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Корневой компонент &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ix7w41ux\"&gt;App.vue&lt;/code&gt; определяет структуру интерфейса: заголовок, навигационную панель и область, в которой отображаются текущие маршруты через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ix0egmr\"&gt;&amp;lt;router-view&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"4-stranicy-views\"&gt;&lt;a href=\"ru/sub-section/frontend.html#4-stranicy-views\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Страницы (views)&lt;/span&gt;&lt;/a&gt;4. Страницы (views)&lt;/h2&gt;\n&lt;h3 id=\"41-homevue\"&gt;&lt;a href=\"ru/sub-section/frontend.html#41-homevue\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.1. Home.vue&lt;/span&gt;&lt;/a&gt;4.1. Home.vue&lt;/h3&gt;\n&lt;p&gt;Главная страница проекта.&lt;br /&gt;\nОтображает набор аналитических статических изображений и краткие подписи к ним.&lt;br /&gt;\nВ текущей версии графики представлены PNG-файлами (временное решение до подключения динамических графиков).&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"42-notfoundvue\"&gt;&lt;a href=\"ru/sub-section/frontend.html#42-notfoundvue\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2. NotFound.vue&lt;/span&gt;&lt;/a&gt;4.2. NotFound.vue&lt;/h3&gt;\n&lt;p&gt;Страница обработки ошибок 404: показывает сообщение и предоставляет ссылку для возврата на главную страницу.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"43-reportinfovue\"&gt;&lt;a href=\"ru/sub-section/frontend.html#43-reportinfovue\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3. ReportInfo.vue&lt;/span&gt;&lt;/a&gt;4.3. ReportInfo.vue&lt;/h3&gt;\n&lt;p&gt;Страница детализированной аналитики по отчёту.&lt;/p&gt;\n&lt;p&gt;Основной функционал включает:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Карточки InfoCard&lt;/strong&gt;&lt;br /&gt;\nДанные загружаются из локального &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f0y0vv0c\"&gt;reportInfo.json&lt;/code&gt;.&lt;br /&gt;\nКарточки отображают ключевые показатели и процентные изменения.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Панель фильтрации&lt;/strong&gt;&lt;br /&gt;\nДоступна настройка:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;типа графика (три варианта),&lt;/li&gt;\n&lt;li&gt;временного диапазона,&lt;/li&gt;\n&lt;li&gt;региона (данные из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0623buif\"&gt;regions.json&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Графики&lt;/strong&gt;&lt;br /&gt;\nВ текущей версии используется статическое изображение.&lt;br /&gt;\nПараметр маршрута &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hhg3arm6\"&gt;reportId&lt;/code&gt; предусмотрен, но пока не применяется.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"44-tablevue\"&gt;&lt;a href=\"ru/sub-section/frontend.html#44-tablevue\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.4. Table.vue&lt;/span&gt;&lt;/a&gt;4.4. Table.vue&lt;/h3&gt;\n&lt;p&gt;Крупный компонент, предназначенный для работы с большими объёмами данных.&lt;/p&gt;\n&lt;p&gt;Возможности компонента:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Получение данных через API&lt;/strong&gt;&lt;br /&gt;\nВыполняется запрос к &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a1ful7i8\"&gt;/api/table-data&lt;/code&gt; с параметрами диапазона дат.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Выбор периода отображения&lt;/strong&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Фильтрация по региону&lt;/strong&gt;&lt;br /&gt;\nИспользуется список из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lvsudxxz\"&gt;regions.json&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Работа с большими таблицами&lt;/strong&gt;&lt;br /&gt;\nТаблица построена на &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r80pqumo\"&gt;v-data-table-virtual&lt;/code&gt;, что позволяет эффективно отображать тысячи записей.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Локальная фильтрация&lt;/strong&gt;&lt;br /&gt;\nУ каждого столбца есть поле поиска.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Форматирование дат&lt;/strong&gt;&lt;br /&gt;\nTimestamp преобразуется в удобный человекочитаемый формат.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"45-reportsvue\"&gt;&lt;a href=\"ru/sub-section/frontend.html#45-reportsvue\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.5. Reports.vue&lt;/span&gt;&lt;/a&gt;4.5. Reports.vue&lt;/h3&gt;\n&lt;p&gt;Страница-заготовка для отображения списка отчётов.&lt;br /&gt;\nВ текущей версии функциональность минимальна.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"5-osnovnye-komponenty\"&gt;&lt;a href=\"ru/sub-section/frontend.html#5-osnovnye-komponenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Основные компоненты&lt;/span&gt;&lt;/a&gt;5. Основные компоненты&lt;/h2&gt;\n&lt;h3 id=\"51-navigationbarvue\"&gt;&lt;a href=\"ru/sub-section/frontend.html#51-navigationbarvue\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.1. NavigationBar.vue&lt;/span&gt;&lt;/a&gt;5.1. NavigationBar.vue&lt;/h3&gt;\n&lt;p&gt;Содержит навигационное меню приложения.&lt;br /&gt;\nИспользуется во всех страницах через корневой компонент.&lt;/p&gt;\n&lt;h3 id=\"52-titlevue\"&gt;&lt;a href=\"ru/sub-section/frontend.html#52-titlevue\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.2. Title.vue&lt;/span&gt;&lt;/a&gt;5.2. Title.vue&lt;/h3&gt;\n&lt;p&gt;Компонент, отображающий заголовок проекта.&lt;/p&gt;\n&lt;h3 id=\"53-infocardvue\"&gt;&lt;a href=\"ru/sub-section/frontend.html#53-infocardvue\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.3. InfoCard.vue&lt;/span&gt;&lt;/a&gt;5.3. InfoCard.vue&lt;/h3&gt;\n&lt;p&gt;Карточка статистики, используемая в ReportInfo.vue.&lt;br /&gt;\nПринимает слоты: название, числовые значения и процентные изменения.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"6-rabota-s-dannymi\"&gt;&lt;a href=\"ru/sub-section/frontend.html#6-rabota-s-dannymi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Работа с данными&lt;/span&gt;&lt;/a&gt;6. Работа с данными&lt;/h2&gt;\n&lt;p&gt;Фронтенд использует несколько источников данных:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Внешний API&lt;/strong&gt;&lt;br /&gt;\nТабличные данные из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yzulvwbg\"&gt;/api/table-data&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Локальные JSON-файлы&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wzoq1h2r\"&gt;reportInfo.json&lt;/code&gt; — краткие характеристики показателей,&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zeb9hcsi\"&gt;regions.json&lt;/code&gt; — информация о регионах.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Статические изображения&lt;/strong&gt;&lt;br /&gt;\nВременные графики и диаграммы в формате PNG/JPG.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"7-ui-frejmvork\"&gt;&lt;a href=\"ru/sub-section/frontend.html#7-ui-frejmvork\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;7. UI-фреймворк&lt;/span&gt;&lt;/a&gt;7. UI-фреймворк&lt;/h2&gt;\n&lt;p&gt;Интерфейс построен на &lt;strong&gt;Vuetify 3&lt;/strong&gt;.&lt;br /&gt;\nИспользуемые элементы интерфейса:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;сетка (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z8tk97qt\"&gt;v-container&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2t0sa4gl\"&gt;v-row&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gsgnomcs\"&gt;v-col&lt;/code&gt;),&lt;/li&gt;\n&lt;li&gt;карточки (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iwjsyfzh\"&gt;v-card&lt;/code&gt;),&lt;/li&gt;\n&lt;li&gt;кнопки (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s9kc8woy\"&gt;v-btn&lt;/code&gt;),&lt;/li&gt;\n&lt;li&gt;текстовые поля (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5qu7tnwv\"&gt;v-text-field&lt;/code&gt;),&lt;/li&gt;\n&lt;li&gt;виртуальная таблица (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bmyijksz\"&gt;v-data-table-virtual&lt;/code&gt;),&lt;/li&gt;\n&lt;li&gt;изображения (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-08q9gfzi\"&gt;v-img&lt;/code&gt;),&lt;/li&gt;\n&lt;li&gt;выпадающие списки (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qfyh39dn\"&gt;v-menu&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kyxtcj0l\"&gt;v-list&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"8-tekushee-sostoyanie-proekta\"&gt;&lt;a href=\"ru/sub-section/frontend.html#8-tekushee-sostoyanie-proekta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;8. Текущее состояние проекта&lt;/span&gt;&lt;/a&gt;8. Текущее состояние проекта&lt;/h2&gt;\n&lt;p&gt;Документация отражает текущее состояние фронтенд-части.&lt;br /&gt;\nПо мере развития проекта структура страниц, визуализация графиков и механизмы работы с данными будут расширяться и обновляться.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.17.2"}],"alternate":[{"href":"ru/sub-section/frontend.html","hreflang":"ru"}],"canonical":"ru/sub-section/frontend.html","vcsPath":"ru/sub-section/frontend.md"},"headings":[{"title":"1. Общая архитектура","href":"ru/sub-section/frontend.html#1-obshaya-arhitektura","level":2},{"title":"2. Маршрутизация","href":"ru/sub-section/frontend.html#2-marshrutizaciya","level":2},{"title":"3. Инициализация приложения","href":"ru/sub-section/frontend.html#3-inicializaciya-prilozheniya","level":2},{"title":"4. Страницы (views)","href":"ru/sub-section/frontend.html#4-stranicy-views","level":2,"items":[{"title":"4.1. Home.vue","href":"ru/sub-section/frontend.html#41-homevue","level":3},{"title":"4.2. NotFound.vue","href":"ru/sub-section/frontend.html#42-notfoundvue","level":3},{"title":"4.3. ReportInfo.vue","href":"ru/sub-section/frontend.html#43-reportinfovue","level":3},{"title":"4.4. Table.vue","href":"ru/sub-section/frontend.html#44-tablevue","level":3},{"title":"4.5. Reports.vue","href":"ru/sub-section/frontend.html#45-reportsvue","level":3}]},{"title":"5. Основные компоненты","href":"ru/sub-section/frontend.html#5-osnovnye-komponenty","level":2,"items":[{"title":"5.1. NavigationBar.vue","href":"ru/sub-section/frontend.html#51-navigationbarvue","level":3},{"title":"5.2. Title.vue","href":"ru/sub-section/frontend.html#52-titlevue","level":3},{"title":"5.3. InfoCard.vue","href":"ru/sub-section/frontend.html#53-infocardvue","level":3}]},{"title":"6. Работа с данными","href":"ru/sub-section/frontend.html#6-rabota-s-dannymi","level":2},{"title":"7. UI-фреймворк","href":"ru/sub-section/frontend.html#7-ui-frejmvork","level":2},{"title":"8. Текущее состояние проекта","href":"ru/sub-section/frontend.html#8-tekushee-sostoyanie-proekta","level":2}],"title":"&lt;strong&gt;Визуальная часть (Frontend)&lt;/strong&gt;"},"router":{"pat
