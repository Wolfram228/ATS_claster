            {"data":{"leading":false,"html":"&lt;h1&gt;&lt;strong&gt;Общая архитектура&lt;/strong&gt;&lt;/h1&gt;\n&lt;p&gt;Бэкенд проекта написан на языке &lt;strong&gt;Python&lt;/strong&gt; с использованием фреймворка &lt;strong&gt;Flask&lt;/strong&gt;, который обеспечивает лёгкость развертывания и гибкость при создании REST API.&lt;br /&gt;\nОсновная роль бэкенда — это обработка, хранение и предоставление данных о ценах на электроэнергию, поступающих из внешних источников.&lt;/p&gt;\n&lt;p&gt;Он отвечает за:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Получение и обработку данных о ценах на электроэнергию&lt;/strong&gt; — модуль &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x8e4xvmq\"&gt;fetch_data.py&lt;/code&gt; регулярно загружает отчёты с официального ресурса АТС, преобразует их в структурированный формат и сохраняет в базу данных.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Взаимодействие с базой данных&lt;/strong&gt; — осуществляется через ORM SQLAlchemy, что позволяет работать с таблицами не напрямую через SQL-запросы, а через Python-классы (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-88bd20p9\"&gt;models.py&lt;/code&gt;). Это повышает читаемость, безопасность и удобство поддержки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Предоставление API для фронтенда&lt;/strong&gt; — через Flask-приложение (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lcuip3ts\"&gt;app.py&lt;/code&gt;) реализованы REST API-эндпоинты, позволяющие запрашивать отчёты, фильтровать данные по дате, региону и другим параметрам, а также скачивать статистические отчёты в формате Excel.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Выполнение математических расчётов и генерацию статистики&lt;/strong&gt; — бэкенд агрегирует значения по типам генерации (ГЭС, ТЭС, АЭС и др.), рассчитывает средние цены, объёмы производства, экспорта и импорта электроэнергии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Архитектура построена по &lt;strong&gt;модульному принципу&lt;/strong&gt;, что обеспечивает прозрачное разделение логики:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-957pemd1\"&gt;config.py&lt;/code&gt; хранит параметры подключения к базе данных;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4kyyqhbe\"&gt;models.py&lt;/code&gt; описывает структуру таблиц и их поля;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xjlfos2y\"&gt;fetch_data.py&lt;/code&gt; отвечает за сбор и загрузку новых данных;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xz5hysvq\"&gt;app.py&lt;/code&gt; объединяет всё в единое веб-приложение и предоставляет интерфейсы для фронтенда.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Каждый компонент бэкенда выполняет строго определённую роль, а их взаимодействие происходит через единый слой данных (PostgreSQL).&lt;br /&gt;\nТакое решение делает систему &lt;strong&gt;масштабируемой&lt;/strong&gt;, &lt;strong&gt;устойчивой к ошибкам&lt;/strong&gt; и &lt;strong&gt;удобной для расширения&lt;/strong&gt; — при необходимости можно добавить новые типы данных, отчётов или API без изменения основной логики.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h1&gt;&lt;strong&gt;Конфигурация Django-проекта&lt;/strong&gt;&lt;/h1&gt;\n&lt;h2 id=\"1-obshee-opisanie\"&gt;&lt;a href=\"ru/sub-section/backend.html#1-obshee-opisanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Общее описание&lt;/span&gt;&lt;/a&gt;1. Общее описание&lt;/h2&gt;\n&lt;p&gt;Этот файл содержит настройки серверной части проекта, включая параметры безопасности, подключение к базе данных, работу API, кеширование, обработку статических файлов и систему прав доступа. Он определяет, как работает сервер, как он принимает запросы, как он взаимодействует с REST-интерфейсом и какие технологии использует.&lt;/p&gt;\n&lt;p&gt;Настройки разделены по функциональным блокам, чтобы обеспечить стабильную работу веб-приложения и корректное взаимодействие с фронтендом и модулем мониторинга.&lt;/p&gt;\n&lt;h2 id=\"2-bazovye-parametry\"&gt;&lt;a href=\"ru/sub-section/backend.html#2-bazovye-parametry\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Базовые параметры&lt;/span&gt;&lt;/a&gt;2. Базовые параметры&lt;/h2&gt;\n&lt;p&gt;В этом блоке задаются фундаментальные характеристики проекта:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;корневая директория приложения;&lt;/li&gt;\n&lt;li&gt;секретный ключ для шифрования;&lt;/li&gt;\n&lt;li&gt;режим работы (Debug/Production);&lt;/li&gt;\n&lt;li&gt;список разрешённых доменов, с которых можно обращаться к API;&lt;/li&gt;\n&lt;li&gt;доверенные источники для CSRF.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Эти настройки позволяют ограничить доступ к приложению и работать только с теми клиентами, которым доверяет система.&lt;/p&gt;\n&lt;h2 id=\"3-ustanovlennye-moduli-prilozheniya\"&gt;&lt;a href=\"ru/sub-section/backend.html#3-ustanovlennye-moduli-prilozheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Установленные модули (приложения)&lt;/span&gt;&lt;/a&gt;3. Установленные модули (приложения)&lt;/h2&gt;\n&lt;p&gt;В проект включены основные компоненты Django, поддержка работы с REST-API, библиотека для CORS (разрешение запросов с других доменов) и основное приложение проекта:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Django admin&lt;/strong&gt; — системная панель администратора&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;REST Framework&lt;/strong&gt; — отвечает за выдачу данных в формате JSON&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;corsheaders&lt;/strong&gt; — разрешает обмен данными между фронтендом и сервером&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;energy_api&lt;/strong&gt; — основная бизнес-логика сервера&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Этот набор позволяет работать с API стабильно и безопасно.&lt;/p&gt;\n&lt;h2 id=\"4-middleware-sistema-obrabotki-zaprosov\"&gt;&lt;a href=\"ru/sub-section/backend.html#4-middleware-sistema-obrabotki-zaprosov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Middleware — система обработки запросов&lt;/span&gt;&lt;/a&gt;4. Middleware — система обработки запросов&lt;/h2&gt;\n&lt;p&gt;Middleware — это «цепочка фильтров», через которые проходит каждый запрос.&lt;/p&gt;\n&lt;p&gt;Файл включает:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;защиту и безопасность;&lt;/li&gt;\n&lt;li&gt;работу с сессиями;&lt;/li&gt;\n&lt;li&gt;обработку CORS-запросов;&lt;/li&gt;\n&lt;li&gt;авторизацию пользователей;&lt;/li&gt;\n&lt;li&gt;защиту от кликового взлома (Clickjacking).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Благодаря этому сервер корректно проверяет все входящие запросы, прежде чем передать их в API.&lt;/p&gt;\n&lt;h2 id=\"5-keshirovanie\"&gt;&lt;a href=\"ru/sub-section/backend.html#5-keshirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Кэширование&lt;/span&gt;&lt;/a&gt;5. Кэширование&lt;/h2&gt;\n&lt;p&gt;Для ускорения работы проекта используется внутренняя система кеширования Django.&lt;br /&gt;\nОна позволяет сохранять данные на короткое время (5 минут), чтобы снизить нагрузку на сервер и ускорить ответы API.&lt;/p&gt;\n&lt;p&gt;Кеш используется:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;при обработке данных,&lt;/li&gt;\n&lt;li&gt;при работе шаблонов,&lt;/li&gt;\n&lt;li&gt;при формировании ответов API.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"6-shablony-templates\"&gt;&lt;a href=\"ru/sub-section/backend.html#6-shablony-templates\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Шаблоны (Templates)&lt;/span&gt;&lt;/a&gt;6. Шаблоны (Templates)&lt;/h2&gt;\n&lt;p&gt;Шаблонизация используется для веб-страниц панели администратора и потенциальных дополнительных страниц.&lt;br /&gt;\nВключён &lt;strong&gt;кеширующий загрузчик&lt;/strong&gt;, что уменьшает нагрузку при открытии страниц.&lt;/p&gt;\n&lt;h2 id=\"7-baza-dannyh\"&gt;&lt;a href=\"ru/sub-section/backend.html#7-baza-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;7. База данных&lt;/span&gt;&lt;/a&gt;7. База данных&lt;/h2&gt;\n&lt;p&gt;Проект использует &lt;strong&gt;PostgreSQL&lt;/strong&gt; — устойчивую и производительную СУБД.&lt;/p&gt;\n&lt;p&gt;Основные параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;название базы;&lt;/li&gt;\n&lt;li&gt;пользователь и пароль;&lt;/li&gt;\n&lt;li&gt;адрес сервера БД;&lt;/li&gt;\n&lt;li&gt;порт;&lt;/li&gt;\n&lt;li&gt;оптимизация соединений (поддержание активного подключения).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Это обеспечивает стабильную работу API, даже при частых обращениях.&lt;/p&gt;\n&lt;h2 id=\"8-lokalizaciya\"&gt;&lt;a href=\"ru/sub-section/backend.html#8-lokalizaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;8. Локализация&lt;/span&gt;&lt;/a&gt;8. Локализация&lt;/h2&gt;\n&lt;p&gt;Настройки языка и времени:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;язык интерфейса — русский;&lt;/li&gt;\n&lt;li&gt;часовой пояс — Asia/Irkutsk.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Благодаря этому логирование и работа времени будут корректны для региона.&lt;/p&gt;\n&lt;h2 id=\"9-staticheskie-fajly\"&gt;&lt;a href=\"ru/sub-section/backend.html#9-staticheskie-fajly\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;9. Статические файлы&lt;/span&gt;&lt;/a&gt;9. Статические файлы&lt;/h2&gt;\n&lt;p&gt;Определено место для хранения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;CSS&lt;/li&gt;\n&lt;li&gt;JavaScript&lt;/li&gt;\n&lt;li&gt;изображений&lt;/li&gt;\n&lt;li&gt;ресурсов фронтенда&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Применяется система контроля версий статических файлов, что предотвращает ошибки при обновлениях.&lt;/p&gt;\n&lt;h2 id=\"10-nastrojki-rest-api\"&gt;&lt;a href=\"ru/sub-section/backend.html#10-nastrojki-rest-api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;10. Настройки REST-API&lt;/span&gt;&lt;/a&gt;10. Настройки REST-API&lt;/h2&gt;\n&lt;p&gt;REST Framework настроен на работу &lt;strong&gt;исключительно с JSON&lt;/strong&gt;, что подходит для современных SPA-приложений и мобильных клиентов.&lt;/p&gt;\n&lt;p&gt;Также включено ограничение количества запросов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;анонимные пользователи — 100 запросов в час;&lt;/li&gt;\n&lt;li&gt;авторизованные — до 1000 запросов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Это защищает сервер от перегрузок и спама.&lt;/p&gt;\n&lt;h2 id=\"11-cors-obmen-dannymi-s-frontendom\"&gt;&lt;a href=\"ru/sub-section/backend.html#11-cors-obmen-dannymi-s-frontendom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;11. CORS — обмен данными с фронтендом&lt;/span&gt;&lt;/a&gt;11. CORS — обмен данными с фронтендом&lt;/h2&gt;\n&lt;p&gt;Фронтенд и backend находятся на разных доменах, поэтому включены настройки:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;разрешён доступ с любых источников (для тестирования);&lt;/li&gt;\n&lt;li&gt;разрешены кросс-доменные запросы с передачей cookies.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Это необходимо для корректной работы Vue-клиента.&lt;/p&gt;\n&lt;h2 id=\"12-logirovanie\"&gt;&lt;a href=\"ru/sub-section/backend.html#12-logirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;12. Логирование&lt;/span&gt;&lt;/a&gt;12. Логирование&lt;/h2&gt;\n&lt;p&gt;Система логирования выводит важные сообщения и SQL-запросы в консоль.&lt;br /&gt;\nЭто помогает отслеживать ошибки и контролировать производительность.&lt;/p&gt;\n&lt;p&gt;В режиме Production уровень логов автоматически станет более строгим.&lt;/p&gt;\n&lt;h2 id=\"13-dopolnitelnye-parametry-bezopasnosti\"&gt;&lt;a href=\"ru/sub-section/backend.html#13-dopolnitelnye-parametry-bezopasnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;13. Дополнительные параметры безопасности&lt;/span&gt;&lt;/a&gt;13. Дополнительные параметры безопасности&lt;/h2&gt;\n&lt;p&gt;Автоматически активируются при включении режима «боевой среды» (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xc5shxt5\"&gt;DEBUG = False&lt;/code&gt;):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;HTTPS-редиректы&lt;/li&gt;\n&lt;li&gt;HSTS&lt;/li&gt;\n&lt;li&gt;безопасные cookies&lt;/li&gt;\n&lt;li&gt;защита от подмены MIME-типов&lt;/li&gt;\n&lt;li&gt;защита от XSS&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Это делает проект соответствующим требованиям современных серверов.&lt;/p&gt;\n&lt;p&gt;Конечно, сейчас сделаю &lt;strong&gt;чистое человеческое описание&lt;/strong&gt;, полностью без технического буллшита и без лишних деталей — так, чтобы заказчик, преподаватель и любой пользователь понял, &lt;em&gt;что делает эта часть системы&lt;/em&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h1&gt;&lt;strong&gt;Главная страница (логика формирования данных)&lt;/strong&gt;&lt;/h1&gt;\n&lt;h2 id=\"1-naznachenie-funkcii\"&gt;&lt;a href=\"ru/sub-section/backend.html#1-naznachenie-funkcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Назначение функции&lt;/span&gt;&lt;/a&gt;1. Назначение функции&lt;/h2&gt;\n&lt;p&gt;Этот модуль отвечает за формирование данных, которые отображаются на главной странице веб-приложения:&lt;br /&gt;\n— графики почасовой генерации электроэнергии,&lt;br /&gt;\n— сравнение вчерашнего дня с позавчерашним,&lt;br /&gt;\n— долевое распределение генерации по типам станций,&lt;br /&gt;\n— динамика изменения цен за последний месяц.&lt;/p&gt;\n&lt;p&gt;Функция собирает данные из базы, обрабатывает их, приводит в удобный для визуализации формат и отдаёт в шаблон.&lt;/p&gt;\n&lt;h2 id=\"2-keshirovanie-uskorenie-raboty\"&gt;&lt;a href=\"ru/sub-section/backend.html#2-keshirovanie-uskorenie-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Кэширование (ускорение работы)&lt;/span&gt;&lt;/a&gt;2. Кэширование (ускорение работы)&lt;/h2&gt;\n&lt;p&gt;Чтобы главная страница загружалась быстро даже при высокой нагрузке, её данные кэшируются на &lt;strong&gt;5 минут&lt;/strong&gt;.&lt;br /&gt;\nЭто означает, что если несколько пользователей открывают страницу подряд, сервер не делает повторные запросы к базе данных, а использует уже готовый результат.&lt;/p&gt;\n&lt;p&gt;Так достигается высокая скорость работы и снижение нагрузки на базу данных.&lt;/p&gt;\n&lt;p&gt;Дополнительно блок с расчётом цен кэшируется на &lt;strong&gt;1 час&lt;/strong&gt;, чтобы оптимизировать ресурсозатратный расчёт статистики за месяц.&lt;/p&gt;\n&lt;h2 id=\"3-rabota-s-datami\"&gt;&lt;a href=\"ru/sub-section/backend.html#3-rabota-s-datami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Работа с датами&lt;/span&gt;&lt;/a&gt;3. Работа с датами&lt;/h2&gt;\n&lt;p&gt;Система автоматически выбирает:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;вчерашний день&lt;/strong&gt;,&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;позавчерашний день&lt;/strong&gt;,&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;и сравнивает их значения.&lt;/p&gt;\n&lt;p&gt;Это позволяет всегда отображать актуальную статистику, без ручного вмешательства.&lt;/p&gt;\n&lt;h2 id=\"4-uchyot-regiona\"&gt;&lt;a href=\"ru/sub-section/backend.html#4-uchyot-regiona\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Учёт региона&lt;/span&gt;&lt;/a&gt;4. Учёт региона&lt;/h2&gt;\n&lt;p&gt;Если пользователь на фронтенде выбирает регион, то:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;фильтруются данные по ценам,&lt;/li&gt;\n&lt;li&gt;создаётся отдельный кэш по каждому региону,&lt;/li&gt;\n&lt;li&gt;отображаемые графики адаптируются под выбранный регион.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;То есть система динамически подстраивается под выбор пользователя.&lt;/p&gt;\n&lt;h2 id=\"5-sbor-dannyh-po-generacii\"&gt;&lt;a href=\"ru/sub-section/backend.html#5-sbor-dannyh-po-generacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Сбор данных по генерации&lt;/span&gt;&lt;/a&gt;5. Сбор данных по генерации&lt;/h2&gt;\n&lt;p&gt;Сервер получает данные за два дня (вчера и позавчера) &lt;strong&gt;одним запросом&lt;/strong&gt;, чтобы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;уменьшить нагрузку,&lt;/li&gt;\n&lt;li&gt;ускорить работу,&lt;/li&gt;\n&lt;li&gt;обеспечить корректное сравнение.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Затем данные раскладываются по часам суток — от 0 до 23 — для построения линейных графиков.&lt;/p&gt;\n&lt;h2 id=\"6-raschyot-dolej-po-tipam-elektrostancij\"&gt;&lt;a href=\"ru/sub-section/backend.html#6-raschyot-dolej-po-tipam-elektrostancij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Расчёт долей по типам электростанций&lt;/span&gt;&lt;/a&gt;6. Расчёт долей по типам электростанций&lt;/h2&gt;\n&lt;p&gt;После обработки почасовых данных система подсчитывает, какую долю в общей генерации заняли:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;ГЭС&lt;/li&gt;\n&lt;li&gt;АЭС&lt;/li&gt;\n&lt;li&gt;ТЭС&lt;/li&gt;\n&lt;li&gt;СЭС&lt;/li&gt;\n&lt;li&gt;ВЭС&lt;/li&gt;\n&lt;li&gt;другие возобновляемые источники&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Все эти данные собираются за &lt;strong&gt;вчерашний день&lt;/strong&gt; в агрегированном виде.&lt;/p&gt;\n&lt;p&gt;Результат используется для круговой диаграммы.&lt;/p&gt;\n&lt;h2 id=\"7-raschyot-srednej-ceny-za-mesyac\"&gt;&lt;a href=\"ru/sub-section/backend.html#7-raschyot-srednej-ceny-za-mesyac\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;7. Расчёт средней цены за месяц&lt;/span&gt;&lt;/a&gt;7. Расчёт средней цены за месяц&lt;/h2&gt;\n&lt;p&gt;Для анализа стоимости электроэнергии система:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;берёт последние &lt;strong&gt;31 день&lt;/strong&gt;,&lt;/li&gt;\n&lt;li&gt;группирует данные по датам,&lt;/li&gt;\n&lt;li&gt;считает среднюю цену в каждый день месяца,&lt;/li&gt;\n&lt;li&gt;кэширует результат на 1 час.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Это даёт пользователю удобный график динамики цен.&lt;/p&gt;\n&lt;h2 id=\"8-itogovaya-podgotovka-dannyh\"&gt;&lt;a href=\"ru/sub-section/backend.html#8-itogovaya-podgotovka-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;8. Итоговая подготовка данных&lt;/span&gt;&lt;/a&gt;8. Итоговая подготовка данных&lt;/h2&gt;\n&lt;p&gt;Перед отправкой готовой информации на страницу:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;данные преобразуются в формат, удобный для графиков и диаграмм,&lt;/li&gt;\n&lt;li&gt;всё приводится к JSON-совместимому виду,&lt;/li&gt;\n&lt;li&gt;данные передаются в шаблон &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mlifhate\"&gt;index.html&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;На фронтенде эти данные подхватываются и визуализируются с помощью графиков.&lt;/p&gt;\n&lt;h2 id=\"v-itoge-stranica-pokazyvaet\"&gt;&lt;a href=\"ru/sub-section/backend.html#v-itoge-stranica-pokazyvaet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;В итоге страница показывает:&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;В итоге страница показывает:&lt;/strong&gt;&lt;/h2&gt;\n&lt;h3 id=\"pochasovoe-proizvodstvo-energii-vchera-vs-pozavchera\"&gt;&lt;a href=\"ru/sub-section/backend.html#pochasovoe-proizvodstvo-energii-vchera-vs-pozavchera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;✔ Почасовое производство энергии (вчера vs. позавчера)&lt;/span&gt;&lt;/a&gt;✔ Почасовое производство энергии (вчера vs. позавчера)&lt;/h3&gt;\n&lt;h3 id=\"doli-kazhdogo-tipa-elektrostancii-za-vchera\"&gt;&lt;a href=\"ru/sub-section/backend.html#doli-kazhdogo-tipa-elektrostancii-za-vchera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;✔ Доли каждого типа электростанции за вчера&lt;/span&gt;&lt;/a&gt;✔ Доли каждого типа электростанции за вчера&lt;/h3&gt;\n&lt;h3 id=\"izmenenie-ceny-pokupki-energii-po-dnyam-za-mesyac\"&gt;&lt;a href=\"ru/sub-section/backend.html#izmenenie-ceny-pokupki-energii-po-dnyam-za-mesyac\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;✔ Изменение цены покупки энергии по дням за месяц&lt;/span&gt;&lt;/a&gt;✔ Изменение цены покупки энергии по дням за месяц&lt;/h3&gt;\n&lt;h3 id=\"adaptaciyu-po-vybrannomu-polzovatelem-regionu\"&gt;&lt;a href=\"ru/sub-section/backend.html#adaptaciyu-po-vybrannomu-polzovatelem-regionu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;✔ Адаптацию по выбранному пользователем региону&lt;/span&gt;&lt;/a&gt;✔ Адаптацию по выбранному пользователем региону&lt;/h3&gt;\n&lt;h3 id=\"bystruyu-rabotu-blagodarya-keshirovaniyu\"&gt;&lt;a href=\"ru/sub-section/backend.html#bystruyu-rabotu-blagodarya-keshirovaniyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;✔ Быструю работу благодаря кэшированию&lt;/span&gt;&lt;/a&gt;✔ Быструю работу благодаря кэшированию&lt;/h3&gt;\n&lt;hr /&gt;\n&lt;h1&gt;&lt;strong&gt;3. Маршрутизация и структура API&lt;/strong&gt;&lt;/h1&gt;\n&lt;h2 id=\"31-naznachenie-razdela\"&gt;&lt;a href=\"ru/sub-section/backend.html#31-naznachenie-razdela\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1. Назначение раздела&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;3.1. Назначение раздела&lt;/strong&gt;&lt;/h2&gt;\n&lt;p&gt;Этот раздел описывает, как организованы адреса (URL) серверной части системы.&lt;br /&gt;\nЭта информация важна для заказчика и пользователя, чтобы понимать, как веб-интерфейс и API взаимодействуют с сервером и откуда поступают данные.&lt;/p&gt;\n&lt;h2 id=\"32-glavnaya-stranica-veb-prilozheniya\"&gt;&lt;a href=\"ru/sub-section/backend.html#32-glavnaya-stranica-veb-prilozheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.2. Главная страница веб-приложения&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;3.2. Главная страница веб-приложения&lt;/strong&gt;&lt;/h2&gt;\n&lt;h3 id=\"321-kornevoj-marshrut\"&gt;&lt;a href=\"ru/sub-section/backend.html#321-kornevoj-marshrut\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.2.1. Корневой маршрут&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;3.2.1. Корневой маршрут&lt;/strong&gt;&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cdhae3o3\"&gt;/&lt;/code&gt; — главная страница системы.&lt;/strong&gt;&lt;br /&gt;\nПри переходе на этот адрес открывается пользовательский интерфейс, включающий таблицы, графики, сводные показатели и другие данные.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"33-administrativnaya-panel\"&gt;&lt;a href=\"ru/sub-section/backend.html#33-administrativnaya-panel\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3. Административная панель&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;3.3. Административная панель&lt;/strong&gt;&lt;/h2&gt;\n&lt;h3 id=\"331-dostup-administratora\"&gt;&lt;a href=\"ru/sub-section/backend.html#331-dostup-administratora\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3.1. Доступ администратора&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;3.3.1. Доступ администратора&lt;/strong&gt;&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5bl40fcp\"&gt;/admin/&lt;/code&gt; — панель администрирования Django.&lt;/strong&gt;&lt;br /&gt;\nИспользуется разработчиками и администраторами для проверки данных, редактирования записей и контроля состояния системы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"34-osnovnoj-api-sistemy\"&gt;&lt;a href=\"ru/sub-section/backend.html#34-osnovnoj-api-sistemy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4. Основной API системы&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;3.4. Основной API системы&lt;/strong&gt;&lt;/h2&gt;\n&lt;h3 id=\"341-obshij-marshrut-api\"&gt;&lt;a href=\"ru/sub-section/backend.html#341-obshij-marshrut-api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4.1. Общий маршрут API&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;3.4.1. Общий маршрут API&lt;/strong&gt;&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mpmi9v5q\"&gt;/api/&lt;/code&gt; — основной адрес API системы.&lt;/strong&gt;&lt;br /&gt;\nВсе данные, отображённые на фронтенде, загружаются именно отсюда.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"342-avtomaticheskaya-generaciya-marshrutov\"&gt;&lt;a href=\"ru/sub-section/backend.html#342-avtomaticheskaya-generaciya-marshrutov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4.2. Автоматическая генерация маршрутов&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;3.4.2. Автоматическая генерация маршрутов&lt;/strong&gt;&lt;/h3&gt;\n&lt;p&gt;Внутри этого маршрута работает специальный компонент — &lt;strong&gt;Router&lt;/strong&gt;, который автоматически формирует набор стандартных API-точек.&lt;/p&gt;\n&lt;p&gt;Он связан с модулем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-krr7xt53\"&gt;EnergyApiViewSet&lt;/code&gt;, который отвечает за:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;получение данных о регионах&lt;/li&gt;\n&lt;li&gt;загрузку таблиц&lt;/li&gt;\n&lt;li&gt;отображение статистики&lt;/li&gt;\n&lt;li&gt;динамику изменения значений&lt;/li&gt;\n&lt;li&gt;сводные показатели&lt;/li&gt;\n&lt;li&gt;подготовку данных для визуализаций&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"343-znachenie-dlya-polzovatelya\"&gt;&lt;a href=\"ru/sub-section/backend.html#343-znachenie-dlya-polzovatelya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4.3. Значение для пользователя&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;3.4.3. Значение для пользователя&lt;/strong&gt;&lt;/h3&gt;\n&lt;p&gt;Для конечного пользователя важно:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;все обновления данных происходят через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b35qcyj4\"&gt;/api/&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;все графики и таблицы получают информацию от одного централизованного источника&lt;/li&gt;\n&lt;li&gt;система работает быстрее и стабильнее благодаря единообразной архитектуре API&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"35-dopolnitelnye-ranee-ispolzovavshiesya-marshruty\"&gt;&lt;a href=\"ru/sub-section/backend.html#35-dopolnitelnye-ranee-ispolzovavshiesya-marshruty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.5. Дополнительные (ранее использовавшиеся) маршруты&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;3.5. Дополнительные (ранее использовавшиеся) маршруты&lt;/strong&gt;&lt;/h2&gt;\n&lt;p&gt;В коде присутствуют закомментированные маршруты, которые использовались раньше, до объединения логики в единый ViewSet.&lt;/p&gt;\n&lt;h3 id=\"351-primery-staryh-marshrutov\"&gt;&lt;a href=\"ru/sub-section/backend.html#351-primery-staryh-marshrutov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.5.1. Примеры старых маршрутов&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;3.5.1. Примеры старых маршрутов&lt;/strong&gt;&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-84qyp4wh\"&gt;/api/regions/&lt;/code&gt; — список регионов&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ycyieeno\"&gt;/api/table/&lt;/code&gt; — таблица текущих значений&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6eyldkwp\"&gt;/api/summary/&lt;/code&gt; — сводка&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lkyh5giu\"&gt;/api/history/&lt;/code&gt; — исторические данные&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zijc4p9w\"&gt;/api/reload/&lt;/code&gt; — перезагрузка данных&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4gpm0fjw\"&gt;/api/report/xls/&lt;/code&gt; — выгрузка отчёта в Excel&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"352-zachem-oni-vazhny-zakazchiku\"&gt;&lt;a href=\"ru/sub-section/backend.html#352-zachem-oni-vazhny-zakazchiku\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.5.2. Зачем они важны заказчику&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;3.5.2. Зачем они важны заказчику&lt;/strong&gt;&lt;/h3&gt;\n&lt;p&gt;Эти строки показывают структуру системы «до» оптимизации.&lt;br /&gt;\nДля заказчика это означает:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;функциональность сохранена полностью&lt;/li&gt;\n&lt;li&gt;логика систематизирована и собрана в более удобный формат&lt;/li&gt;\n&lt;li&gt;поддержка и развитие системы теперь проще и дешевле&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"36-otladochnye-instrumenty\"&gt;&lt;a href=\"ru/sub-section/backend.html#36-otladochnye-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.6. Отладочные инструменты&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;3.6. Отладочные инструменты&lt;/strong&gt;&lt;/h2&gt;\n&lt;h3 id=\"361-ispolzovanie-debug-paneli\"&gt;&lt;a href=\"ru/sub-section/backend.html#361-ispolzovanie-debug-paneli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.6.1. Использование debug-панели&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;3.6.1. Использование debug-панели&lt;/strong&gt;&lt;/h3&gt;\n&lt;p&gt;В режиме разработки подключается маршрут:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yafyu1cx\"&gt;__debug__/&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Он используется только разработчиками для диагностики и анализа производительности.&lt;br /&gt;\nВ продакшене полностью отключён.&lt;/p&gt;\n&lt;h2 id=\"37-itogovoe-opisanie\"&gt;&lt;a href=\"ru/sub-section/backend.html#37-itogovoe-opisanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.7. Итоговое описание&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;3.7. Итоговое описание&lt;/strong&gt;&lt;/h2&gt;\n&lt;p&gt;Маршрутизация устроена так, чтобы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;пользователь&lt;/strong&gt; всегда попадал на интерфейс по адресу &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bhri5pxt\"&gt;/&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;администратор&lt;/strong&gt; мог управлять системой через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g89lswax\"&gt;/admin/&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;фронтенд&lt;/strong&gt; получал все данные из централизованного API &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4g0tcvdt\"&gt;/api/&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;система оставалась гибкой, расширяемой и простой в обслуживании&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h1&gt;&lt;strong&gt;4. Импорт и обработка данных с ATSenergo&lt;/strong&gt;&lt;/h1&gt;\n&lt;h2 id=\"41-naznachenie-razdela\"&gt;&lt;a href=\"ru/sub-section/backend.html#41-naznachenie-razdela\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.1. Назначение раздела&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;4.1. Назначение раздела&lt;/strong&gt;&lt;/h2&gt;\n&lt;p&gt;Данный раздел описывает, как в систему подгружаются данные о производстве и потреблении электроэнергии из внешнего источника — сайта &lt;strong&gt;ATSenergo&lt;/strong&gt;.&lt;br /&gt;\nИнформация нужна для заказчика, чтобы понимать, как система получает актуальные данные, а пользователю — что данные достоверные и автоматически обновляются.&lt;/p&gt;\n&lt;h2 id=\"42-obshaya-logika-raboty\"&gt;&lt;a href=\"ru/sub-section/backend.html#42-obshaya-logika-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2. Общая логика работы&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;4.2. Общая логика работы&lt;/strong&gt;&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Команда управления данными&lt;/strong&gt; реализована через &lt;strong&gt;Django Management Command&lt;/strong&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4mhfm41n\"&gt;BaseCommand&lt;/code&gt;).&lt;br /&gt;\nЭто позволяет запускать загрузку данных с сервера командой в консоли.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Период загрузки&lt;/strong&gt; — последние 2 года (730 дней), каждый день проверяется отдельно.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Проверка существующих данных&lt;/strong&gt;: если за конкретную дату данные уже есть, они не загружаются повторно.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Кэширование истории загрузок&lt;/strong&gt; через модель &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ggg4nmk7\"&gt;LoadHistory&lt;/code&gt; — позволяет отслеживать, какие даты уже обработаны и сколько записей добавлено.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"43-zagruzka-xls-fajlov-s-sajta\"&gt;&lt;a href=\"ru/sub-section/backend.html#43-zagruzka-xls-fajlov-s-sajta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3. Загрузка XLS-файлов с сайта&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;4.3. Загрузка XLS-файлов с сайта&lt;/strong&gt;&lt;/h2&gt;\n&lt;p&gt;Система автоматически:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Формирует URL страницы с данными за нужную дату.&lt;/li&gt;\n&lt;li&gt;Находит ссылку на XLS-файл с помощью &lt;strong&gt;BeautifulSoup&lt;/strong&gt;.&lt;/li&gt;\n&lt;li&gt;Загружает файл и открывает его через &lt;strong&gt;Pandas&lt;/strong&gt;.&lt;/li&gt;\n&lt;li&gt;Пример кода для скачивания файла:&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;file_url = urljoin(page.url, link[&lt;span class=\"hljs-string\"&gt;'href'&lt;/span&gt;])\nresp = requests.get(file_url, headers=&lt;span class=\"hljs-variable language_\"&gt;self&lt;/span&gt;.HEADERS, verify=&lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;)\ndf = pd.read_excel(BytesIO(resp.content), skiprows=&lt;span class=\"hljs-number\"&gt;5&lt;/span&gt;, header=&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;, names=&lt;span class=\"hljs-variable language_\"&gt;self&lt;/span&gt;.COLS)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"901\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-901\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-901\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-901.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"44-struktura-dannyh\"&gt;&lt;a href=\"ru/sub-section/backend.html#44-struktura-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.4. Структура данных&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;4.4. Структура данных&lt;/strong&gt;&lt;/h2&gt;\n&lt;p&gt;Данные включают:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Регион и час суток&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;Планируемое производство по типам электростанций: ГЭС, АЭС, ТЭС, СЭС, ВЭС, прочие ВИЭ&lt;/li&gt;\n&lt;li&gt;Минимальные и максимальные значения производства&lt;/li&gt;\n&lt;li&gt;Плановое потребление, экспорт, импорт&lt;/li&gt;\n&lt;li&gt;Цены на покупку и продажу электроэнергии&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Все поля автоматически преобразуются в числовой формат, чтобы корректно сохраняться в базе.&lt;/p&gt;\n&lt;h2 id=\"45-sohranenie-dannyh\"&gt;&lt;a href=\"ru/sub-section/backend.html#45-sohranenie-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.5. Сохранение данных&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;4.5. Сохранение данных&lt;/strong&gt;&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Каждая строка XLS преобразуется в запись модели &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ijpmdoy5\"&gt;ElecReport&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Временная метка (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ug8atslc\"&gt;timestamp&lt;/code&gt;) создаётся с учётом часового пояса Москвы.&lt;/li&gt;\n&lt;li&gt;После успешного сохранения обновляется или создаётся запись в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o0iuvyn3\"&gt;LoadHistory&lt;/code&gt; для учёта количества добавленных строк.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Пример кода для сохранения одной записи:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;ElecReport.objects.create(\n    region=row[&lt;span class=\"hljs-string\"&gt;'region'&lt;/span&gt;],\n    hour=hour_val,\n    timestamp=aware_dt,\n    plan_GES=value_GES,\n    plan_AES=value_AES,\n    ...\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"961\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-961\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-961\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-961.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"46-logirovanie-i-obrabotka-oshibok\"&gt;&lt;a href=\"ru/sub-section/backend.html#46-logirovanie-i-obrabotka-oshibok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.6. Логирование и обработка ошибок&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;4.6. Логирование и обработка ошибок&lt;/strong&gt;&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Для каждой даты выводится информация о статусе: &lt;strong&gt;загружено&lt;/strong&gt;, &lt;strong&gt;уже есть&lt;/strong&gt; или &lt;strong&gt;ошибка&lt;/strong&gt;.&lt;/li&gt;\n&lt;li&gt;Ошибки не останавливают работу всей загрузки: система продолжает обработку следующих дат.&lt;/li&gt;\n&lt;li&gt;Это обеспечивает стабильность и надёжность обновления данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"47-znachenie-dlya-polzovatelej-i-zakazchikov\"&gt;&lt;a href=\"ru/sub-section/backend.html#47-znachenie-dlya-polzovatelej-i-zakazchikov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.7. Значение для пользователей и заказчиков&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;4.7. Значение для пользователей и заказчиков&lt;/strong&gt;&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Заказчик&lt;/strong&gt; получает гарантию, что все исторические и текущие данные доступны и проверены.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Пользователь&lt;/strong&gt; видит актуальные графики и показатели без необходимости ручного обновления.&lt;/li&gt;\n&lt;li&gt;Система полностью автоматизирована, минимизируя человеческий фактор и ошибки.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h1&gt;&lt;strong&gt;5. Модели данных&lt;/strong&gt;&lt;/h1&gt;\n&lt;h2 id=\"51-naznachenie-razdela\"&gt;&lt;a href=\"ru/sub-section/backend.html#51-naznachenie-razdela\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.1. Назначение раздела&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;5.1. Назначение раздела&lt;/strong&gt;&lt;/h2&gt;\n&lt;p&gt;Данный раздел описывает, какие модели используются для хранения данных о производстве и потреблении электроэнергии, а также истории загрузок.&lt;br /&gt;\nЭто важно для заказчика, чтобы видеть, какие данные хранятся, и для пользователя — чтобы понимать, что все показатели доступны для аналитики и построения графиков.&lt;/p&gt;\n&lt;h2 id=\"52-model\"&gt;&lt;a href=\"ru/sub-section/backend.html#52-model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.2. Модель &lt;/span&gt;&lt;/a&gt;&lt;strong&gt;5.2. Модель &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-td6btwva\"&gt;ElecReport&lt;/code&gt;&lt;/strong&gt;&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Назначение:&lt;/strong&gt; хранение ежедневной информации по регионам о производстве, потреблении и ценах на электроэнергию.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Основные поля:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7vv76r1e\"&gt;region&lt;/code&gt; — название региона.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3mhd48zv\"&gt;timestamp&lt;/code&gt; — временная метка конкретного часа.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gocv872a\"&gt;hour&lt;/code&gt; — час суток.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iruba3gt\"&gt;plan_GES, plan_AES, plan_TES, plan_SES, plan_VES, plan_other&lt;/code&gt; — планируемое производство по типам станций.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ujww0aph\"&gt;techmin_*&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2v5ynn13\"&gt;technomin_*&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qn2eds05\"&gt;techmax_*&lt;/code&gt; — технологические минимумы, номиналы и максимумы.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7tc4yn7s\"&gt;plan_consumption, plan_export, plan_import&lt;/code&gt; — планируемое потребление и баланс с соседними регионами.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d38hdxus\"&gt;price_buy, price_sell, full_plan&lt;/code&gt; — цены и общий план производства.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Особенности:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Все числовые поля допускают пустые значения (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f67z10yl\"&gt;null=True, blank=True&lt;/code&gt;) для корректного хранения неполных данных.&lt;/li&gt;\n&lt;li&gt;Есть индексы по &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ogmjcuxn\"&gt;timestamp&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tmpw9q0t\"&gt;region&lt;/code&gt; для ускоренного поиска и выборки данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Пример упрощённого кода модели:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;ElecReport&lt;/span&gt;(models.Model):\n    region = models.CharField(max_length=&lt;span class=\"hljs-number\"&gt;255&lt;/span&gt;)\n    timestamp = models.DateTimeField()\n    hour = models.IntegerField()\n    plan_GES = models.FloatField(null=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;, blank=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n    plan_AES = models.FloatField(null=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;, blank=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n    &lt;span class=\"hljs-comment\"&gt;# ... остальные поля аналогично&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1084\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1084\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1084\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1084.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"53-model\"&gt;&lt;a href=\"ru/sub-section/backend.html#53-model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.3. Модель &lt;/span&gt;&lt;/a&gt;&lt;strong&gt;5.3. Модель &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xnqejcxu\"&gt;LoadHistory&lt;/code&gt;&lt;/strong&gt;&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Назначение:&lt;/strong&gt; хранение информации о том, когда и сколько данных было загружено из внешних источников.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Основные поля:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mstpy5rq\"&gt;data_date&lt;/code&gt; — дата, за которую загружены данные.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-238sftfu\"&gt;load_time&lt;/code&gt; — дата и время последней загрузки.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-og7lmp4a\"&gt;count&lt;/code&gt; — количество загруженных записей за конкретную дату.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Особенности:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Используется как контрольный механизм для предотвращения повторной загрузки данных.&lt;/li&gt;\n&lt;li&gt;Позволяет пользователю видеть, какие даты уже обработаны, а заказчику — контролировать полноту данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Пример кода модели:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;LoadHistory&lt;/span&gt;(models.Model):\n    data_date = models.DateField(primary_key=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n    load_time = models.DateTimeField(auto_now=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n    count = models.IntegerField(default=&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1137\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1137\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1137\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1137.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"54-znachenie-dlya-polzovatelej-i-zakazchikov\"&gt;&lt;a href=\"ru/sub-section/backend.html#54-znachenie-dlya-polzovatelej-i-zakazchikov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.4. Значение для пользователей и заказчиков&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;5.4. Значение для пользователей и заказчиков&lt;/strong&gt;&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Пользователь&lt;/strong&gt;: через эти модели обеспечивается доступ к актуальным данным для построения графиков, статистики и аналитики по регионам и типам электростанций.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Заказчик&lt;/strong&gt;: получает уверенность, что данные хранятся структурировано, легко проверяются и доступны для любых отчётов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h1&gt;&lt;strong&gt;6. Панель администратора (Admin)&lt;/strong&gt;&lt;/h1&gt;\n&lt;h2 id=\"61-naznachenie-razdela\"&gt;&lt;a href=\"ru/sub-section/backend.html#61-naznachenie-razdela\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6.1. Назначение раздела&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;6.1. Назначение раздела&lt;/strong&gt;&lt;/h2&gt;\n&lt;p&gt;Этот раздел описывает, как данные моделей &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tmke4aku\"&gt;ElecReport&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2h026l2k\"&gt;LoadHistory&lt;/code&gt; представлены в административной панели Django.&lt;br /&gt;\nАдминка позволяет пользователям (например, сотрудникам компании) и заказчику быстро просматривать, фильтровать и искать данные без необходимости прямого доступа к базе.&lt;/p&gt;\n&lt;h2 id=\"62-model-v-adminke\"&gt;&lt;a href=\"ru/sub-section/backend.html#62-model-v-adminke\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6.2. Модель  в админке&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;6.2. Модель &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tiw59x2b\"&gt;ElecReport&lt;/code&gt; в админке&lt;/strong&gt;&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Отображаемые поля:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eo2z1lym\"&gt;region&lt;/code&gt; — регион.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q3xrj81e\"&gt;timestamp&lt;/code&gt; — время записи.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gtgor47h\"&gt;plan_GES, plan_AES&lt;/code&gt; — производство по ГЭС и АЭС.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-42xxr6x7\"&gt;price_buy&lt;/code&gt; — цена покупки электроэнергии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Функции:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Фильтрация по &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ou3bwvl\"&gt;region&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yk6e81q0\"&gt;timestamp&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Поиск по названию региона.&lt;/li&gt;\n&lt;li&gt;Возможность просмотра данных по дате с помощью &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gmeq94aq\"&gt;date_hierarchy&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Пример кода:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-meta\"&gt;@admin.register(&lt;span class=\"hljs-params\"&gt;ElecReport&lt;/span&gt;)&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;ElecReportAdmin&lt;/span&gt;(admin.ModelAdmin):\n    list_display = [&lt;span class=\"hljs-string\"&gt;'region'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'timestamp'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'plan_GES'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'plan_AES'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'price_buy'&lt;/span&gt;]\n    list_filter = [&lt;span class=\"hljs-string\"&gt;'region'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'timestamp'&lt;/span&gt;]\n    search_fields = [&lt;span class=\"hljs-string\"&gt;'region'&lt;/span&gt;]\n    date_hierarchy = &lt;span class=\"hljs-string\"&gt;'timestamp'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1220\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1220\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1220\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1220.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"63-model-v-adminke\"&gt;&lt;a href=\"ru/sub-section/backend.html#63-model-v-adminke\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6.3. Модель  в админке&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;6.3. Модель &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wp84o28n\"&gt;LoadHistory&lt;/code&gt; в админке&lt;/strong&gt;&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Отображаемые поля:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k25m7i9p\"&gt;data_date&lt;/code&gt; — дата загрузки данных.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ryyjmknf\"&gt;load_time&lt;/code&gt; — время последней загрузки.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qd9x68w2\"&gt;count&lt;/code&gt; — количество записей, загруженных за день.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Функции:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Фильтрация по &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ulb0xtm5\"&gt;data_date&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Просмотр истории загрузок по календарю (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5pd6g48q\"&gt;date_hierarchy&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Пример кода:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-meta\"&gt;@admin.register(&lt;span class=\"hljs-params\"&gt;LoadHistory&lt;/span&gt;)&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;LoadHistoryAdmin&lt;/span&gt;(admin.ModelAdmin):\n    list_display = [&lt;span class=\"hljs-string\"&gt;'data_date'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'load_time'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'count'&lt;/span&gt;]\n    list_filter = [&lt;span class=\"hljs-string\"&gt;'data_date'&lt;/span&gt;]\n    date_hierarchy = &lt;span class=\"hljs-string\"&gt;'data_date'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1268\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1268\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1268\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1268.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"64-znachenie-dlya-polzovatelej-i-zakazchikov\"&gt;&lt;a href=\"ru/sub-section/backend.html#64-znachenie-dlya-polzovatelej-i-zakazchikov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6.4. Значение для пользователей и заказчиков&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;6.4. Значение для пользователей и заказчиков&lt;/strong&gt;&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Пользователь&lt;/strong&gt;: может быстро находить нужные данные, проверять статистику и исправлять ошибки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Заказчик&lt;/strong&gt;: получает прозрачный интерфейс контроля данных, видит актуальные записи и историю загрузок без необходимости технических знаний о базе данных.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.17.2"}],"alternate":[{"href":"ru/sub-section/backend.html","hreflang":"ru"}],"canonical":"ru/sub-section/backend.html","vcsPath":"ru/sub-section/backend.md"},"headings":[{"title":"1. Общее описание","href":"ru/sub-section/backend.html#1-obshee-opisanie","level":2},{"title":"2. Базовые параметры","href":"ru/sub-section/backend.html#2-bazovye-parametry","level":2},{"title":"3. Установленные модули (приложения)","href":"ru/sub-section/backend.html#3-ustanovlennye-moduli-prilozheniya","level":2},{"title":"4. Middleware — система обработки запросов","href":"ru/sub-section/backend.html#4-middleware-sistema-obrabotki-zaprosov","level":2},{"title":"5. Кэширование","href":"ru/sub-section/backend.html#5-keshirovanie","level":2},{"title":"6. Шаблоны (Templates)","href":"ru/sub-section/backend.html#6-shablony-templates","level":2},{"title":"7. База данных","href":"ru/sub-section/backend.html#7-baza-dannyh","level":2},{"tit
