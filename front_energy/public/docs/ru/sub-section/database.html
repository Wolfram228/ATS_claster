        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"obshaya-informaciya\"&gt;&lt;a href=\"ru/sub-section/database.html#obshaya-informaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общая информация&lt;/span&gt;&lt;/a&gt;Общая информация&lt;/h2&gt;\n&lt;p&gt;Для хранения и анализа статистических данных по потреблению электроэнергии используется база данных PostgreSQL.&lt;br /&gt;\nДанные загружаются с сайта &lt;a href=\"https://www.atsenergo.ru/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;АТС (Администратор торговой системы)&lt;/a&gt; в формате Excel, после чего импортируются в PostgreSQL с помощью скрипта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rqks6y2r\"&gt;pg_dump.txt&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Визуальная схема структуры базы данных показана ниже:&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"ru/sub-section/ИИТИАД.drawio.png\" alt=\"Структура таблицы базы данных\" /&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"import-dannyh\"&gt;&lt;a href=\"ru/sub-section/database.html#import-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Импорт данных&lt;/span&gt;&lt;/a&gt;Импорт данных&lt;/h2&gt;\n&lt;p&gt;Импорт базы данных производится через скрипт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-paiwkoym\"&gt;pg_dump.txt&lt;/code&gt; (ранее &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mrw916vb\"&gt;pg_dump.tar&lt;/code&gt;), содержащий SQL-команды для восстановления структуры и наполнения таблиц.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Основные этапы:&lt;/strong&gt;&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Скачивание Excel-файлов при помощи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ul0i54e4\"&gt;fetch_data.py&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Конвертация данных в подходящий формат (CSV/SQL).&lt;/li&gt;\n&lt;li&gt;Импорт в PostgreSQL при помощи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9z3zyz7e\"&gt;pgAdmin4&lt;/code&gt; через файл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w3a67ev8\"&gt;pg_dump.txt&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;После загрузки данные становятся доступны для анализа и визуализации во фронтенде (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qda0t1v2\"&gt;index.html&lt;/code&gt;).&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"osnovnaya-tablica\"&gt;&lt;a href=\"ru/sub-section/database.html#osnovnaya-tablica\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основная таблица: &lt;/span&gt;&lt;/a&gt;Основная таблица: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0cqdhfux\"&gt;public.elec_reports&lt;/code&gt;&lt;/h2&gt;\n&lt;p&gt;Таблица содержит агрегированные данные о планах, фактических показателях и ценах на электроэнергию по регионам России.&lt;/p&gt;\n&lt;h3 id=\"struktura-tablicy\"&gt;&lt;a href=\"ru/sub-section/database.html#struktura-tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Структура таблицы&lt;/span&gt;&lt;/a&gt;Структура таблицы&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Поле&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;id&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Уникальный идентификатор записи&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;region&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Субъект РФ&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;timestamp&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Дата и время отчёта&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;plan_GES&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;План генерации гидроэлектростанций&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;plan_AES&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;План генерации атомных электростанций&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;plan_TES&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;План генерации тепловых электростанций&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;plan_SES&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;План генерации солнечных электростанций&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;plan_VES&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;План генерации ветровых электростанций&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;plan_other&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;План генерации прочих ВИЭ&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;plan_consumption&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;План потребления электроэнергии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;plan_export&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;План экспорта&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;plan_import&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;План импорта&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;price_buy&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Средняя цена покупки&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;price_sell&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Средняя цена продажи&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;full_plan&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Полный план энергопроизводства&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;technmin_GES&lt;/strong&gt; / &lt;strong&gt;technmax_GES&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Минимальная/максимальная техническая мощность ГЭС&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;technmin_AES&lt;/strong&gt; / &lt;strong&gt;technmax_AES&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Минимальная/максимальная мощность АЭС&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;technmin_TES&lt;/strong&gt; / &lt;strong&gt;technmax_TES&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Минимальная/максимальная мощность ТЭС&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;technmin_SES&lt;/strong&gt; / &lt;strong&gt;technmax_SES&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Минимальная/максимальная мощность СЭС&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;technmin_VES&lt;/strong&gt; / &lt;strong&gt;technmax_VES&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Минимальная/максимальная мощность ВЭС&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;technmin_other&lt;/strong&gt; / &lt;strong&gt;technmax_other&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Прочие ВИЭ (мин/макс мощности)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;plan_GES&lt;/strong&gt;, &lt;strong&gt;plan_AES&lt;/strong&gt;, ...&lt;/td&gt;\n&lt;td&gt;Плановые показатели для каждого типа электростанции&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"naznachenie-klyuchevyh-fajlov\"&gt;&lt;a href=\"ru/sub-section/database.html#naznachenie-klyuchevyh-fajlov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Назначение ключевых файлов&lt;/span&gt;&lt;/a&gt;Назначение ключевых файлов&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Файл&lt;/th&gt;\n&lt;th&gt;Назначение&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;fetch_data.py&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Скрипт для автоматического скачивания Excel-файлов с сайта АТС и подготовки данных к импорту в PostgreSQL.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;pg_dump.txt&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;SQL-дамп базы данных с готовыми таблицами и данными. Используется для импорта в pgAdmin4.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;index.html&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Визуальная часть, отображающая данные, извлечённые из базы. Включает таблицы, графики и фильтры.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;database.md&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Раздел документации, описывающий структуру, назначение и принципы работы базы данных проекта.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"svyazi-tablic-i-logika-ispolzovaniya\"&gt;&lt;a href=\"ru/sub-section/database.html#svyazi-tablic-i-logika-ispolzovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связи таблиц и логика использования&lt;/span&gt;&lt;/a&gt;Связи таблиц и логика использования&lt;/h2&gt;\n&lt;p&gt;В текущей версии проекта используется &lt;strong&gt;одна основная таблица &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9cd1gsti\"&gt;public.elec_reports&lt;/code&gt;&lt;/strong&gt;, которая содержит все ключевые данные.&lt;br /&gt;\nНа следующих этапах возможно расширение базы и добавление вспомогательных таблиц, например:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cek561vx\"&gt;regions&lt;/code&gt; — справочник регионов;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-72nxa53h\"&gt;prices&lt;/code&gt; — таблица детализированных ценовых данных;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lph2ag9s\"&gt;plans&lt;/code&gt; — архив планов и прогнозов по дням.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Все операции выборки и анализа данных происходят именно через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9x7e4g7h\"&gt;public.elec_reports&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"ispolzovanie-bazy-dannyh\"&gt;&lt;a href=\"ru/sub-section/database.html#ispolzovanie-bazy-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование базы данных&lt;/span&gt;&lt;/a&gt;Использование базы данных&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Импорт осуществляется из файла &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r3mipzel\"&gt;pg_dump.txt&lt;/code&gt; с помощью pgAdmin4.&lt;/li&gt;\n&lt;li&gt;Скрипт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nan4p16l\"&gt;fetch_data.py&lt;/code&gt; автоматически скачивает актуальные Excel-файлы с сайта АТС и подготавливает их для загрузки.&lt;/li&gt;\n&lt;li&gt;Все данные сохраняются в таблицу &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ttuxo32\"&gt;public.elec_reports&lt;/code&gt;, после чего доступны для анализа и визуализации на фронтенде (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-akz4ogb4\"&gt;index.html&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"vzaimodejstvie-s-backend\"&gt;&lt;a href=\"ru/sub-section/database.html#vzaimodejstvie-s-backend\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Взаимодействие с Backend&lt;/span&gt;&lt;/a&gt;Взаимодействие с Backend&lt;/h2&gt;\n&lt;p&gt;Backend использует SQL-запросы для выборки агрегированных данных, статистики и построения отчётов.&lt;br /&gt;\nЭти данные передаются на фронтенд для отображения таблиц и графиков в визуальной части веб-сервиса.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"ispolzovanie-vo-frontend\"&gt;&lt;a href=\"ru/sub-section/database.html#ispolzovanie-vo-frontend\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование во Frontend&lt;/span&gt;&lt;/a&gt;Использование во Frontend&lt;/h2&gt;\n&lt;p&gt;Фронтенд визуализирует данные из базы данных в виде интерактивных таблиц и графиков.&lt;br /&gt;\nДля этого используется файл index.html, где данные отображаются по регионам и видам электростанций.&lt;/p&gt;\n&lt;hr /&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.17.2"}],"alternate":[{"href":"ru/sub-section/database.html","hreflang":"ru"}],"canonical":"ru/sub-section/database.html","layout":"default","title":"База данных","vcsPath":"ru/sub-section/database.md"},"headings":[{"title":"Общая информация","href":"ru/sub-section/database.html#obshaya-informaciya","level":2},{"title":"Импорт данных","href":"ru/sub-section/database.html#import-dannyh","level":2},{"title":"Основная таблица: public.elec_reports","href":"ru/sub-section/database.html#osnovnaya-tablica","level":2,"items":[{"title":"Структура таблицы","href":"ru/sub-section/database.html#struktura-tablicy","level":3}]},{"title":"Назначение ключевых файлов","href":"ru/sub-section/database.html#naznachenie-klyuchevyh-fajlov","level":2},{"title":"Связи таблиц и логика использования","href":"ru/sub-section/database.html#svyazi-tablic-i-logika-ispolzovaniya","level":2},{"title":"Использование базы данных","href":"ru/sub-section/database.html#ispolzovanie-bazy-dannyh","level":2},{"title":"Взаимодействие с Backend","href":"ru/sub-section/database.html#vzaimodejstvie-s-backend","level":2},{"title":"Использование во Frontend","href":"ru/sub-section/database.html#ispolzovanie-vo-frontend","level":2}],"title":"База данных (Database)"},"router":{"pathname":"ru/sub-section/database","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc":true,"search":true,"feedback":true}}
        </script>
