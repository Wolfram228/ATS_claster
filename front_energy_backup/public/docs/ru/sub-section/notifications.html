            {"data":{"leading":false,"html":"&lt;h2 id=\"1-obshaya-arhitektura\"&gt;&lt;a href=\"ru/sub-section/notifications.html#1-obshaya-arhitektura\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Общая архитектура&lt;/span&gt;&lt;/a&gt;1. Общая архитектура&lt;/h2&gt;\n&lt;p&gt;Система представляет собой модульное приложение на Python, которое отслеживает изменения данных во внешнем API и отправляет уведомления через Telegram и email.&lt;br /&gt;\nРабота организована вокруг циклического мониторинга, выполняемого модулем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-migq6pcs\"&gt;api_watcher&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Структура файлов проекта:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Main.py          — точка входа\nApi_wather.py    — модуль мониторинга API\nConfig.py        — конфигурация проекта\nBot_sender.py    — отправка уведомлений в Telegram\nMail_sender.py   — отправка уведомлений по email\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"2-opisanie-modulej\"&gt;&lt;a href=\"ru/sub-section/notifications.html#2-opisanie-modulej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Описание модулей&lt;/span&gt;&lt;/a&gt;2. Описание модулей&lt;/h2&gt;\n&lt;h3 id=\"mainpy-tochka-vhoda\"&gt;&lt;a href=\"ru/sub-section/notifications.html#mainpy-tochka-vhoda\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Main.py — точка входа&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Main.py — точка входа&lt;/strong&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Назначение:&lt;/strong&gt; запуск основного цикла мониторинга.&lt;/p&gt;\n&lt;p&gt;Функциональность:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;вызывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1nkj4hl0\"&gt;run_monitor()&lt;/code&gt; из модуля &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-55zidg9h\"&gt;api_watcher&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;инициирует процесс отслеживания данных API.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"api_watherpy-monitoring-api\"&gt;&lt;a href=\"ru/sub-section/notifications.html#api_watherpy-monitoring-api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Api_wather.py — мониторинг API&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Api_wather.py — мониторинг API&lt;/strong&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Назначение:&lt;/strong&gt; основной модуль, выполняющий проверку состояния удалённого API.&lt;/p&gt;\n&lt;p&gt;Основные операции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;выполняет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l8wq8eli\"&gt;GET&lt;/code&gt;-запрос с таймаутом;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;парсит JSON-ответ;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;получает первую запись массива &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-87z8qy5e\"&gt;data&lt;/code&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;извлекает ключевые поля:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;дату,&lt;/li&gt;\n&lt;li&gt;время обработки,&lt;/li&gt;\n&lt;li&gt;количество записей;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;сравнивает новые данные с последними сохранёнными;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;при обнаружении изменений инициирует отправку уведомлений.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"configpy-konfiguraciya\"&gt;&lt;a href=\"ru/sub-section/notifications.html#configpy-konfiguraciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Config.py — конфигурация&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Config.py — конфигурация&lt;/strong&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Назначение:&lt;/strong&gt; хранение всех настроек системы.&lt;/p&gt;\n&lt;p&gt;Содержит:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;токен Telegram-бота,&lt;/li&gt;\n&lt;li&gt;URL целевого API,&lt;/li&gt;\n&lt;li&gt;параметры SMTP-почты (логин, пароль, сервер, порт),&lt;/li&gt;\n&lt;li&gt;ID Telegram-чата для уведомлений.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"bot_senderpy-otpravka-telegram-uvedomlenij\"&gt;&lt;a href=\"ru/sub-section/notifications.html#bot_senderpy-otpravka-telegram-uvedomlenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bot_sender.py — отправка Telegram-уведомлений&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Bot_sender.py — отправка Telegram-уведомлений&lt;/strong&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Назначение:&lt;/strong&gt; передача сообщений пользователю через Telegram Bot API.&lt;/p&gt;\n&lt;p&gt;Функциональность:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;формирует URL запроса Telegram API на основе токена;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;принимает текст сообщения;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;создаёт POST-запрос с параметрами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;ID чата,&lt;/li&gt;\n&lt;li&gt;текст уведомления;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;отправляет сообщение о новых данных или ошибках.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h3 id=\"mail_senderpy-otpravka-email-uvedomlenij\"&gt;&lt;a href=\"ru/sub-section/notifications.html#mail_senderpy-otpravka-email-uvedomlenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mail_sender.py — отправка email-уведомлений&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Mail_sender.py — отправка email-уведомлений&lt;/strong&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Назначение:&lt;/strong&gt; уведомления по электронной почте через SMTP.&lt;/p&gt;\n&lt;p&gt;Функциональность:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;принимает тему письма и текст;&lt;/li&gt;\n&lt;li&gt;формирует email-объект (заголовки, тело);&lt;/li&gt;\n&lt;li&gt;импортирует SMTP-данные из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fr2cv9t8\"&gt;config.py&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;авторизуется на SMTP-сервере;&lt;/li&gt;\n&lt;li&gt;отправляет письмо получателю;&lt;/li&gt;\n&lt;li&gt;используется как канал резервных либо дублирующих уведомлений.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"3-shema-raboty-sistemy\"&gt;&lt;a href=\"ru/sub-section/notifications.html#3-shema-raboty-sistemy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Схема работы системы&lt;/span&gt;&lt;/a&gt;3. Схема работы системы&lt;/h2&gt;\n&lt;p&gt;Последовательность действий приложения:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Запуск &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f1ar99gt\"&gt;main.py&lt;/code&gt;&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;вызывается &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cjf23qmf\"&gt;run_monitor()&lt;/code&gt; из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9il7nroq\"&gt;api_watcher.py&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Стартовые уведомления&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Telegram/email сообщение о запуске мониторинга.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Основной цикл мониторинга&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;выполнение запроса к API;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;извлечение ключевых данных (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ofb5usws\"&gt;date&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ulort8la\"&gt;time&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9dn3ds5s\"&gt;count&lt;/code&gt;);&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;сравнение с последними известными значениями;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;при обнаружении изменений:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;отправка уведомлений через&lt;br /&gt;\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ac3ntzf\"&gt;bot_sender.py&lt;/code&gt; (Telegram)&lt;br /&gt;\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gv419fij\"&gt;mail_sender.py&lt;/code&gt; (email);&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;ожидание заданного интервала и повтор цикла.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Обработка ошибок&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;любое исключение логируется;&lt;/li&gt;\n&lt;li&gt;отправляется уведомление об ошибке в Telegram и/или email.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"4-logika-raboty-kratkaya-diagramma\"&gt;&lt;a href=\"ru/sub-section/notifications.html#4-logika-raboty-kratkaya-diagramma\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Логика работы (краткая диаграмма)&lt;/span&gt;&lt;/a&gt;4. Логика работы (краткая диаграмма)&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Main.py\n   ↓ вызывает\nApi_wather.run_monitor()\n   ↓ цикл\n[Запрос к API]\n   ↓\n[Новые данные?] — нет → ждать → повтор\n       │\n      да\n       ↓\nBot_sender.send()\nMail_sender.send()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"305\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-305\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-305\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-305.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.17.2"}],"alternate":[{"href":"ru/sub-section/notifications.html","hreflang":"ru"}],"canonical":"ru/sub-section/notifications.html","vcsPath":"ru/sub-section/notifications.md"},"headings":[{"title":"1. Общая архитектура","href":"ru/sub-section/notifications.html#1-obshaya-arhitektura","level":2},{"title":"2. Описание модулей","href":"ru/sub-section/notifications.html#2-opisanie-modulej","level":2,"items":[{"title":"Main.py — точка входа","href":"ru/sub-section/notifications.html#mainpy-tochka-vhoda","level":3},{"title":"Api_wather.py — мониторинг API","href":"ru/sub-section/notifications.html#api_watherpy-monitoring-api","level":3},{"title":"Config.py — конфигурация","href":"ru/sub-section/notifications.html#configpy-konfiguraciya","level":3},{"title":"Bot_sender.py — отправка Telegram-уведомлений","href":"ru/sub-section/notifications.html#bot_senderpy-otpravka-telegram-uvedomlenij","level":3},{"title":"Mail_sender.py — отправка email-уведомлений","href":"ru/sub-section/notifications.html#mail_senderpy-otpravka-email-uvedomlenij","level":3}]},{"title":"3. Схема работы системы","href":"ru/sub-section/notifications.html#3-shema-raboty-sistemy","level":2},{"title":"4. Логика работы (краткая диаграмма)","href":"ru/sub-section/notifications.html#4-logika-raboty-kratkaya-diagramma","level":2}],"title":"&lt;strong&gt;Система оповещений&lt;/strong&gt;"},"router":{"pathname":"ru/sub-section/notifications","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc":true,"search":true,"feedback":true}}
