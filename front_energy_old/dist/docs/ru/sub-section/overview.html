        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"obshaya-informaciya-o-proekte\"&gt;&lt;a href=\"ru/sub-section/overview.html#obshaya-informaciya-o-proekte\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общая информация о проекте&lt;/span&gt;&lt;/a&gt;Общая информация о проекте&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;Название проекта:&lt;/strong&gt;&lt;br /&gt;\n&lt;strong&gt;Веб-сервис сбора и анализа статистической информации цен на электроэнергию&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Источник данных:&lt;/strong&gt;&lt;br /&gt;\n&lt;a href=\"https://www.atsenergo.ru/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;АТС — Администратор торговой системы оптового рынка электроэнергии и мощности&lt;/a&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"cel-proekta\"&gt;&lt;a href=\"ru/sub-section/overview.html#cel-proekta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Цель проекта&lt;/span&gt;&lt;/a&gt;Цель проекта&lt;/h2&gt;\n&lt;p&gt;Целью проекта является &lt;strong&gt;создание автоматизированного веб-сервиса&lt;/strong&gt;, который:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;ежедневно &lt;strong&gt;загружает данные&lt;/strong&gt; о выработке и потреблении электроэнергии из открытых источников сайта АТС;&lt;/li&gt;\n&lt;li&gt;сохраняет их в базе данных PostgreSQL;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;анализирует&lt;/strong&gt; статистику и рассчитывает сводные показатели;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;визуализирует результаты&lt;/strong&gt; на веб-странице в удобной форме (графики, таблицы, отчёты);&lt;/li&gt;\n&lt;li&gt;обеспечивает возможность формирования уведомлений и отчётов на основе полученных данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"zadachi-proekta\"&gt;&lt;a href=\"ru/sub-section/overview.html#zadachi-proekta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Задачи проекта&lt;/span&gt;&lt;/a&gt;Задачи проекта&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Разработка &lt;strong&gt;backend-части&lt;/strong&gt; для автоматической загрузки, обработки и хранения данных.&lt;/li&gt;\n&lt;li&gt;Создание &lt;strong&gt;frontend-интерфейса&lt;/strong&gt; для визуализации данных (графики, фильтры, таблицы).&lt;/li&gt;\n&lt;li&gt;Реализация &lt;strong&gt;системы оповещений&lt;/strong&gt;, которая информирует о важных изменениях в статистике.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Математическая обработка&lt;/strong&gt; и анализ собранных данных (вычисление средних, максимумов, план/факт и т.д.).&lt;/li&gt;\n&lt;li&gt;Организация &lt;strong&gt;базы данных&lt;/strong&gt; для долговременного хранения и аналитики.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"struktura-proekta\"&gt;&lt;a href=\"ru/sub-section/overview.html#struktura-proekta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Структура проекта&lt;/span&gt;&lt;/a&gt;Структура проекта&lt;/h2&gt;\n&lt;p&gt;Проект разделён на несколько модулей, каждый из которых отвечает за свой уровень логики:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Раздел&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Backend&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Обрабатывает данные, взаимодействует с базой и формирует API для фронтенда.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Frontend&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Визуализирует данные в виде графиков и таблиц.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Database&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Хранит и структурирует данные, поступающие с сайта АТС.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Notifications&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Реализует систему уведомлений и оповещений на основе событий и изменений данных.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Math&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Выполняет математическую обработку данных (средние значения, прогнозы и т.д.).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"arhitektura-proekta\"&gt;&lt;a href=\"ru/sub-section/overview.html#arhitektura-proekta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Архитектура проекта&lt;/span&gt;&lt;/a&gt;Архитектура проекта&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Источник данных:&lt;/strong&gt; сайт &lt;a href=\"https://www.atsenergo.ru/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;atsenergo.ru&lt;/a&gt;, где ежедневно публикуются Excel-файлы с отчётами.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Скрипт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d3d4q9hg\"&gt;fetch_data.py&lt;/code&gt;&lt;/strong&gt; — автоматически скачивает и подготавливает данные.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;PostgreSQL&lt;/strong&gt; — хранит очищенные и обработанные данные.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Backend (Python)&lt;/strong&gt; — выполняет загрузку, преобразование и обработку данных, передаёт их на фронтенд.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Frontend (HTML, JS)&lt;/strong&gt; — отображает данные пользователю в виде интерактивной визуализации.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"prakticheskoe-primenenie\"&gt;&lt;a href=\"ru/sub-section/overview.html#prakticheskoe-primenenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Практическое применение&lt;/span&gt;&lt;/a&gt;Практическое применение&lt;/h2&gt;\n&lt;p&gt;Разработанный сервис может использоваться:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;аналитиками и специалистами энергокомпаний;&lt;/li&gt;\n&lt;li&gt;студентами и преподавателями для учебных проектов;&lt;/li&gt;\n&lt;li&gt;исследователями в области электроэнергетики;&lt;/li&gt;\n&lt;li&gt;разработчиками, изучающими работу с открытыми источниками данных и визуализацией.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"rezultat-raboty\"&gt;&lt;a href=\"ru/sub-section/overview.html#rezultat-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результат работы&lt;/span&gt;&lt;/a&gt;Результат работы&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Автоматическая система обновления данных из источника;&lt;/li&gt;\n&lt;li&gt;Централизованная база данных для хранения и анализа информации;&lt;/li&gt;\n&lt;li&gt;Веб-интерфейс с визуализацией и аналитикой;&lt;/li&gt;\n&lt;li&gt;Возможность масштабирования и интеграции с внешними модулями.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h2 id=\"avtory-i-ispolzuemye-tehnologii\"&gt;&lt;a href=\"ru/sub-section/overview.html#avtory-i-ispolzuemye-tehnologii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Авторы и используемые технологии&lt;/span&gt;&lt;/a&gt;Авторы и используемые технологии&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;Технологии проекта:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Backend: Python, Flask, psycopg2 / SQLAlchemy&lt;/li&gt;\n&lt;li&gt;Frontend: HTML, CSS, JavaScript&lt;/li&gt;\n&lt;li&gt;Database: PostgreSQL&lt;/li&gt;\n&lt;li&gt;Средства администрирования: pgAdmin4&lt;/li&gt;\n&lt;li&gt;Среда разработки: Visual Studio Code, GitHub&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Данный проект выполнен в учебных целях и демонстрирует пример построения системы анализа открытых энергетических данных с использованием современных технологий веб-разработки и баз данных.&lt;/p&gt;\n&lt;/blockquote&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.17.2"}],"alternate":[{"href":"ru/sub-section/overview.html","hreflang":"ru"}],"canonical":"ru/sub-section/overview.html","vcsPath":"ru/sub-section/overview.md"},"headings":[{"title":"Общая информация о проекте","href":"ru/sub-section/overview.html#obshaya-informaciya-o-proekte","level":2},{"title":"Цель проекта","href":"ru/sub-section/overview.html#cel-proekta","level":2},{"title":"Задачи проекта","href":"ru/sub-section/overview.html#zadachi-proekta","level":2},{"title":"Структура проекта","href":"ru/sub-section/overview.html#struktura-proekta","level":2},{"title":"Архитектура проекта","href":"ru/sub-section/overview.html#arhitektura-proekta","level":2},{"title":"Практическое применение","href":"ru/sub-section/overview.html#prakticheskoe-primenenie","level":2},{"title":"Результат работы","href":"ru/sub-section/overview.html#rezultat-raboty","level":2},{"title":"Авторы и используемые технологии","href":"ru/sub-section/overview.html#avtory-i-ispolzuemye-tehnologii","level":2}],"title":"Введение"},"router":{"pathname":"ru/sub-section/overview","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"toc":true,"search":true,"feedback":true}}
